<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>WebGuard AI</title>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="top">
    <span class="brand"><img src="icons/logo.svg" alt="" width="24" height="24"> WebGuard AI</span>
    <span id="fresh" class="fresh"></span>
  </header>

  <main>
    <p id="host" class="host" title="">–</p>
    <div id="gauge-box" class="gauge-box" data-state="idle">
      <svg id="gauge" class="gauge" viewBox="0 0 240 132" role="img" aria-labelledby="gauge-label">
        <title id="gauge-label">Risk score</title>
      </svg>
      <svg class="scan" viewBox="0 0 240 132" aria-hidden="true">
        <path d="M24 118 A96 96 0 0 1 216 118" pathLength="100"/>
      </svg>
      <div class="readout">
        <p class="score"><span id="risk">–</span><span class="of">/100</span></p>
      </div>
    </div>
    <p id="badge" class="category"></p>
    <p id="note" class="note" role="status" aria-live="polite"></p>
    <button id="open-report" type="button" class="primary" hidden>View detailed report</button>
    <button id="retry" type="button" class="secondary" hidden>Try again</button>
  </main>

  <footer class="auto">
    <div>
      <p class="auto-title">Automatic checks</p>
      <p id="auto-text" class="auto-text">Check each site you visit (address only).</p>
    </div>
    <button id="auto" type="button" class="switch" role="switch" aria-checked="false" aria-describedby="auto-text">
      <span class="sr-only">Automatic checks</span>
    </button>
  </footer>
  <script type="module" src="popup.js"></script>
</body>
</html>
